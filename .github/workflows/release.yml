name: NPM Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente que deve coincidir com package.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      GITHUB_REF_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Publish verified package
        run: npm run release -- --ci
